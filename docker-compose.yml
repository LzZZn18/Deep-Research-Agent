services:
  db:
    image: pgvector/pgvector:pg16
    container_name: deepsearch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepsearch
      POSTGRES_PASSWORD: deepsearch
      POSTGRES_DB: deepsearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsearch -d deepsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: deepsearch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: deepsearch-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 容器内通过服务名访问 db / redis，不能用 localhost
      DB_URL: postgresql://deepsearch:deepsearch@db:5432/deepsearch
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # 持久化 fastembed/BGE 模型缓存，避免每次重启重新下载
      - embedding-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build: ./backend
    container_name: deepsearch-worker
    restart: unless-stopped
    command: python -m app.worker
    env_file:
      - ./backend/.env
    environment:
      DB_URL: postgresql://deepsearch:deepsearch@db:5432/deepsearch
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - embedding-cache:/root/.cache

  frontend:
    build: ./frontend
    container_name: deepsearch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  embedding-cache:
