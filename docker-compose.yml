services:
  db:
    image: pgvector/pgvector:pg16
    container_name: deepsearch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepsearch
      POSTGRES_PASSWORD: deepsearch
      POSTGRES_DB: deepsearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsearch -d deepsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
